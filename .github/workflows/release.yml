name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: pomo
  BINARY_NAME: pomo
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: Build Linux packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            clang \
            lld \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-egl1 \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxfixes-dev \
            libvulkan-dev \
            libssl-dev \
            patchelf \
            rpm \
            flatpak \
            flatpak-builder

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ------------------------------------------------------------
      # Build Rust binary
      # ------------------------------------------------------------

      - name: Build release binary
        run: cargo build --release

      - name: Prepare staging directory
        run: |
          mkdir -p staging/usr/bin
          cp "target/release/${BINARY_NAME}" \
             "staging/usr/bin/${BINARY_NAME}"

      # ------------------------------------------------------------
      # AppImage
      # ------------------------------------------------------------

      - name: Download linuxdeploy
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy

          chmod +x linuxdeploy

      - name: Create AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp "target/release/${BINARY_NAME}" \
             "AppDir/usr/bin/${BINARY_NAME}"

          cp assets/pomodoro.png \
             "AppDir/usr/share/icons/hicolor/512x512/apps/pomodoro.png"

          cat > AppDir/usr/share/applications/pomodoro.desktop <<EOF
          [Desktop Entry]
          Name=Pomodoro
          Comment=Simple Pomodoro timer
          Exec=${BINARY_NAME}
          Icon=pomodoro
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF

          ./linuxdeploy \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/pomodoro.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/pomodoro.png \
            --output appimage

          mv *.AppImage \
            "${APP_NAME}-${VERSION}-x86_64.AppImage"

      # ------------------------------------------------------------
      # RPM
      # ------------------------------------------------------------

      - name: Build RPM
        run: |
          mkdir -p rpm-root/usr/bin
          cp "target/release/${BINARY_NAME}" \
             rpm-root/usr/bin/${BINARY_NAME}

          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          cp packaging/pomodoro.spec rpmbuild/SPECS/

          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "_version ${GITHUB_REF_NAME#v}" \
            -bb rpmbuild/SPECS/pomodoro.spec

          cp rpmbuild/RPMS/x86_64/*.rpm \
             "${APP_NAME}-${VERSION}-x86_64.rpm"

      # ------------------------------------------------------------
      # Flatpak
      # ------------------------------------------------------------

      - name: Add Flathub repository
        run: |
          flatpak remote-add --if-not-exists \
            --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --user \
            --disable-rofiles-fuse \
            --force-clean \
            flatpak-build \
            flatpak/com.amrit.Pomodoro.yml

          flatpak build-export \
            flatpak-repo \
            flatpak-build

          flatpak build-bundle \
            flatpak-repo \
            "${APP_NAME}-${VERSION}-x86_64.flatpak" \
            com.amrit.Pomodoro

      # ------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.AppImage
            *.rpm
            *.flatpak

  # --------------------------------------------------------------
  # GitHub Release
  # --------------------------------------------------------------

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.rpm
            dist/*.flatpak
